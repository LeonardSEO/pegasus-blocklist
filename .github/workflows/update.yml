name: Refresh Pegasus intelligence

on:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'candidates/approved.txt'
      - 'allowlist.txt'
      - 'scripts/**'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      discovery_seconds:
        description: 'Discovery time budget in seconds (scheduled runs use 600)'
        required: true
        default: '600'
        type: string

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Query public research services
        if: github.event_name != 'push'
        env:
          DISCOVERY_SECONDS: ${{ inputs.discovery_seconds || '600' }}
        shell: bash
        run: |
          status=0
          python3 -u scripts/refresh.py --max-seconds "$DISCOVERY_SECONDS" || status=$?
          if [ "$status" -eq 3 ]; then
            echo '::warning::Discovery is partial: see the reports in the artifact and update PR. No candidates are approved automatically.'
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Archive discovery reports
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-${{ github.run_id }}
          path: |
            candidates/latest.json
            sources/provenance.json
          if-no-files-found: error
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify lists
        run: |
          python3 scripts/build.py
          python3 scripts/build.py --check
      - name: Create update PR and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lists README.md sources
          if [ -f candidates/latest.json ]; then git add candidates/latest.json; fi
          if git diff --cached --quiet; then exit 0; fi
          branch="automation/refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Refresh lists and discovery reports $(date -u +%F)"
          git push origin "$branch"
          {
            echo 'Rebuild all list formats from reviewed sources and record available discovery leads.'
            echo
            echo 'Discovery candidates remain unapproved and are never added to the blocklists automatically.'
            if [ -f candidates/latest.json ]; then
              echo
              python3 -c 'import json; r=json.load(open("candidates/latest.json")); print("Research status:",r["status"]); print("Unapproved candidates:",len(r["candidates"])); print("Source errors:",len(r["errors"]))'
              echo 'Full evidence: candidates/latest.json in this PR and the workflow artifact.'
            fi
          } > "$RUNNER_TEMP/update-pr.md"
          pr=$(gh pr create --base main --head "$branch" --title "Refresh lists $(date -u +%F)" --body-file "$RUNNER_TEMP/update-pr.md")
          gh pr merge "$pr" --auto --squash
          # Explicit dispatch avoids approval-gated CI for GITHUB_TOKEN-created PRs.
          gh workflow run ci.yml --ref "$branch"
